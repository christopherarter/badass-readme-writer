<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Incident Deck sample timeline</title>
  <desc id="desc">A read-only incident timeline with detection, rollback, and recovery events.</desc>
  <rect width="960" height="600" fill="#f7f8fb"/>
  <rect width="960" height="82" fill="#172541"/>
  <text x="54" y="51" fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="700">Incident Deck</text>
  <text x="252" y="50" fill="#bcc8e6" font-family="Arial, sans-serif" font-size="16">/ Sample incident</text>
  <text x="90" y="152" fill="#1c2740" font-family="Arial, sans-serif" font-size="32" font-weight="700">Payment API outage</text>
  <text x="90" y="182" fill="#5b6780" font-family="Arial, sans-serif" font-size="17">A read-only timeline of the bundled sample events.</text>
  <g font-family="Arial, sans-serif">
    <rect x="90" y="215" width="780" height="96" rx="9" fill="white" stroke="#dce2eb"/>
    <rect x="90" y="215" width="6" height="96" fill="#6583d8"/>
    <text x="117" y="243" fill="#52627d" font-size="14">09:12 UTC</text>
    <text x="117" y="269" fill="#1c2740" font-size="19" font-weight="700">Elevated error rate detected</text>
    <text x="117" y="293" fill="#1c2740" font-size="15">Checkout requests begin returning 5xx responses.</text>
    <rect x="90" y="330" width="780" height="96" rx="9" fill="white" stroke="#dce2eb"/>
    <rect x="90" y="330" width="6" height="96" fill="#6583d8"/>
    <text x="117" y="358" fill="#52627d" font-size="14">09:24 UTC</text>
    <text x="117" y="384" fill="#1c2740" font-size="19" font-weight="700">Rollback started</text>
    <text x="117" y="408" fill="#1c2740" font-size="15">The team rolls back the latest deployment.</text>
    <rect x="90" y="445" width="780" height="96" rx="9" fill="white" stroke="#dce2eb"/>
    <rect x="90" y="445" width="6" height="96" fill="#6583d8"/>
    <text x="117" y="473" fill="#52627d" font-size="14">09:41 UTC</text>
    <text x="117" y="499" fill="#1c2740" font-size="19" font-weight="700">Service recovered</text>
    <text x="117" y="523" fill="#1c2740" font-size="15">Error rate returns to baseline.</text>
  </g>
</svg>
